## 局限（务必随结论一起引用）

- 单模型种子 (42)；跨分区种子 3 个（42/7/2026）。
- 调优参数只在 `current_2` 上选，未按 K 分别调参（见上"口径声明"）。
- 未做配对显著性检验与 Holm/BH 多重校正 —— 属探索阶段，结论不进论文数字。
- 未使用 `test_locked.csv`。
